; Phase 4B - quality profiles for the RTX 3050 Ti laptop target (Ryzen 7 6800H / Win 11).
;
; These groups override the engine baseline (Engine/Config/BaseScalability.ini) only where
; the forest world needs different behaviour. Level numbers are the engine's quality levels:
;   0 = LOW      1 = MEDIUM      2 = HIGH (project default)      3 = ULTRA
; The project renders on the Lumen Software RT path; hardware ray tracing is deliberately
; not part of any profile (see DefaultEngine.ini).

; ------------------------------------------------------------------ vegetation density
; The dense forest is only affordable as a streamed, instance based world: every level keeps
; the same content but scales how much of it is drawn, which is what keeps the frame time
; stable while walking or driving through the streamed world.
[FoliageQuality@0]
foliage.DensityScale=0.35
grass.DensityScale=0.35
foliage.LODDistanceScale=0.5
grass.CullDistanceScale=0.4
pcg.Quality=0

[FoliageQuality@1]
foliage.DensityScale=0.6
grass.DensityScale=0.6
foliage.LODDistanceScale=0.7
grass.CullDistanceScale=0.7
pcg.Quality=1

[FoliageQuality@2]
foliage.DensityScale=1.0
grass.DensityScale=1.0
foliage.LODDistanceScale=1.0
grass.CullDistanceScale=1.0
pcg.Quality=2

[FoliageQuality@3]
foliage.DensityScale=1.35
grass.DensityScale=1.35
foliage.LODDistanceScale=1.15
grass.CullDistanceScale=1.25
pcg.Quality=3

; ------------------------------------------------------------------ view distance
[ViewDistanceQuality@0]
r.ViewDistanceScale=0.5
r.SkeletalMeshLODBias=2

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.7
r.SkeletalMeshLODBias=1

[ViewDistanceQuality@2]
r.ViewDistanceScale=1.0
r.SkeletalMeshLODBias=0

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.25
r.SkeletalMeshLODBias=0

; ------------------------------------------------------------------ shadows (Virtual Shadow Maps)
; Even LOW keeps a shadowing solution; VSM is replaced by classic CSM instead of being
; switched off completely, so the world never loses its grounding.
[ShadowQuality@0]
r.Shadow.Virtual.Enable=0
r.Shadow.MaxResolution=1024
r.Shadow.DistanceScale=0.5
r.Shadow.CSM.MaxCascades=2

[ShadowQuality@1]
r.Shadow.Virtual.Enable=1
r.Shadow.MaxResolution=1024
r.Shadow.DistanceScale=0.75
r.Shadow.CSM.MaxCascades=3
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5
r.Shadow.Virtual.SMRT.RayCountDirectional=6

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1
r.Shadow.MaxResolution=2048
r.Shadow.DistanceScale=1.0
r.Shadow.CSM.MaxCascades=4
r.Shadow.Virtual.MaxPhysicalPages=4096
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.SMRT.RayCountDirectional=8

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
r.Shadow.MaxResolution=2048
r.Shadow.DistanceScale=1.2
r.Shadow.CSM.MaxCascades=4
r.Shadow.Virtual.MaxPhysicalPages=6144
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.SMRT.RayCountDirectional=8

; ------------------------------------------------------------------ global illumination (Lumen)
; Software RT at every level; ULTRA only raises the sampling quality, it does not switch
; to hardware ray tracing.
[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=0
r.DistanceFieldAO=0
r.AOQuality=0
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.HardwareRayTracing=0
r.Lumen.TraceMeshSDFs.Allow=0

[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.HardwareRayTracing=0
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.TraceMeshSDFs.Allow=0
r.Lumen.ScreenProbeGather.ShortRangeAO=0
r.Lumen.TranslucencyVolume.RadianceCache.NumProbesToTraceBudget=40
r.LumenScene.Radiosity.ProbeSpacing=12

[GlobalIlluminationQuality@2]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.HardwareRayTracing=0
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.TraceMeshSDFs.Allow=0
r.LumenScene.Radiosity.ProbeSpacing=8
r.Lumen.ScreenProbeGather.TwoSidedFoliageBackfaceDiffuse=1
r.Lumen.ScreenProbeGather.ShortRangeAO.FoliageOcclusionStrength=0.7

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.HardwareRayTracing=0
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.TraceMeshSDFs.Allow=1
r.LumenScene.Radiosity.ProbeSpacing=6
r.Lumen.ScreenProbeGather.TwoSidedFoliageBackfaceDiffuse=1
r.Lumen.ScreenProbeGather.ShortRangeAO.FoliageOcclusionStrength=0.8

; ------------------------------------------------------------------ reflections
[ReflectionQuality@0]
r.ReflectionMethod=0
r.Lumen.Reflections.Allow=0

[ReflectionQuality@1]
r.ReflectionMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTrace=0.2

[ReflectionQuality@2]
r.ReflectionMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.4

[ReflectionQuality@3]
r.ReflectionMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.5

; ------------------------------------------------------------------ atmosphere / effects
[EffectsQuality@0]
r.VolumetricFog=0
r.BloomQuality=2
r.LightShaftQuality=0
r.DepthOfFieldQuality=0
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1

[EffectsQuality@1]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=32
r.BloomQuality=3
r.LightShaftQuality=0
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1

[EffectsQuality@2]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
r.BloomQuality=4
r.LightShaftQuality=1
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1

[EffectsQuality@3]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.HistoryMissSupersampleCount=8
r.BloomQuality=5
r.LightShaftQuality=1

; ------------------------------------------------------------------ streaming / textures
; The streaming pool itself is deliberately NOT set per profile: with
; r.Streaming.LimitPoolSizeToVRAM=1 the engine derives it from the available VRAM and keeps
; writing -1 (auto) over any value written here. Only the settings that really differ are
; listed: the mip bias and the anisotropy.
[TextureQuality@0]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=1
r.MaxAnisotropy=1
r.VT.MaxAnisotropy=4

[TextureQuality@1]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=0.5
r.MaxAnisotropy=2
r.VT.MaxAnisotropy=4

[TextureQuality@2]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=0
r.MaxAnisotropy=4
r.VT.MaxAnisotropy=8

[TextureQuality@3]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MipBias=0
r.MaxAnisotropy=8
r.VT.MaxAnisotropy=8
