; Phase 4B - default quality profile for the project (RTX 3050 Ti laptop, 1080p class).
;
; HIGH (2) is the project default: dense but streamed forest, Virtual Shadow Maps, Lumen
; software RT. The actual per-level values live in Config/DefaultScalability.ini; the
; engine copies this file to Saved/Config/<Platform>/GameUserSettings.ini on first run.
;   ULTRA (3) raises foliage density / resolution / Lumen quality,
;   MEDIUM (1) and LOW (0) scale vegetation, shadows and volumetrics down.

[/Script/Engine.GameUserSettings]
bUseVSync=False
bUseDynamicResolution=False

[ScalabilityGroups]
sg.ResolutionQuality=2
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
sg.PostProcessQuality=2
sg.TextureQuality=2
sg.EffectsQuality=2
sg.FoliageQuality=2
sg.ShadingQuality=2
sg.LandscapeQuality=2
